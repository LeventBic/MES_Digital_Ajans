<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes Dijital — Dijital & Influencer Ajansı</title>
  <meta name="description" content="Mes Dijital, Uşak merkezli dijital pazarlama ve influencer ajansı.">
  <script src="assets/js/theme.js?v=12"></script>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=12">
  <link rel="stylesheet" href="assets/css/home.css?v=12">
</head>
<body class="home is-intro">

  <div class="curtain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor__label">Aç</span></div>

  <!-- Üst bant: büyük yazı logo, menü, yerel saat, iletişim -->
  <header class="top">
    <a href="index.html" class="wordmark" aria-label="Mes Dijital ana sayfa">Mes Dijital</a>
    <nav class="top__nav" aria-label="Ana menü">
      <a href="index.html" aria-current="page">Kategoriler</a>, <a href="ajans.html">Ajans</a>
    </nav>
    <span class="top__clock mono">Uşak <span data-clock>--:--:--</span></span>
    <span class="top__end">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Gece ve gündüz modu arasında geç"><span class="theme-toggle__dot" aria-hidden="true"></span><span data-theme-label>Gece</span></button>
      <a class="top__contact" href="ajans.html#iletisim">İletişim</a>
    </span>
    <button class="menu-btn" aria-expanded="false" aria-controls="mobile-menu">Menü</button>
  </header>
  <nav class="mobile-menu" id="mobile-menu" aria-label="Mobil menü">
    <a href="index.html">Kategoriler</a>
    <a href="ajans.html">Ajans</a>
    <a href="ajans.html#hizmetler">Hizmetler</a>
    <a href="ajans.html#iletisim">İletişim</a>
    <button class="theme-toggle mono" type="button" data-theme-toggle><span class="theme-toggle__dot" aria-hidden="true"></span><span data-theme-label>Gece</span></button>
  </nav>

  <main class="stage" aria-label="Kategoriler">
    <!-- Kategori sütunu ve soldaki liste assets/js/data.js'ten üretilir -->
    <div class="reel" tabindex="0" aria-roledescription="kaydırılabilir kategori listesi">
      <div class="reel__track"></div>
    </div>

    <!-- Sol: tüm kategoriler (seçili olan koyu) -->
    <nav class="cats" aria-label="Kategoriler">
      <ol></ol>
    </nav>

    <!-- Seçili kategorinin bilgileri, çerçevenin iki yanında -->
    <span class="meta meta--l"><span class="swap" data-f="cat">[ Alt başlık ]</span></span>
    <span class="meta meta--r"><span class="swap" data-f="year">[ Hizmetler ]</span></span>
    <span class="meta meta--n"><span class="swap" data-f="idx">01</span></span>

    <!-- Sağ üst: kısa tanıtım -->
    <div class="about">
      <p>[ Ajansı anlatan iki üç cümlelik kısa tanıtım metni buraya gelecek. ]</p>
      <p>İletişim:<br><a href="mailto:iletisim@mesdijital.com.tr">iletisim@mesdijital.com.tr</a></p>
    </div>

    <!-- Izgara görünümü -->
    <div class="gridv" aria-label="Kategoriler ızgarası"><div class="gridv__inner"></div></div>

    <nav class="foot foot--l views" aria-label="Görünüm">
      <button type="button" data-view="v">Dikey</button>, <button type="button" data-view="h">Yatay</button>, <button type="button" data-view="g">Izgara</button>
    </nav>
    <span class="foot foot--r muted">© <span data-year>2026</span> Mes Dijital</span>
  </main>

  <!-- Açılış: siyah zemin, sayaç, M'nin arasında değişen kareler -->
  <div class="intro" aria-hidden="true">
    <div class="intro__flash"></div>
    <span class="intro__count mono">000</span>
  </div>

  <!-- İkiye bölünmüş M: açılışta logo, sonra seçili projenin çerçevesi -->
  <div class="frame" aria-hidden="true">
    <svg class="frame__half l" viewBox="0 0 50 100" preserveAspectRatio="none"><polygon pathLength="1" points="8,86 8,14 24,14 47,50 47,74 24,40 24,86"/></svg>
    <svg class="frame__half r" viewBox="50 0 50 100" preserveAspectRatio="none"><polygon pathLength="1" points="92,86 92,14 76,14 53,50 53,74 76,40 76,86"/></svg>
  </div>

  <script src="assets/js/data.js?v=12"></script>
  <script src="assets/js/main.js?v=12"></script>
  <script src="assets/js/home.js?v=12"></script>

</html>
